name: Frontend CI


on:
  push:
    branches: ['develop', 'main']
  pull_request:
    branches: ['develop', 'main']

permissions:
  contents: read

# 같은 브랜치/PR에서 새 푸시가 오면 진행 중이던 실행을 취소
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 버전은 .node-version(24.16.0)을 단일 소스로 사용 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Prettier 포맷 검사 
      - name: Check formatting
        run: npm run format:check

      # ESLint
      - name: Lint
        run: npm run lint

      # 타입체크 
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
